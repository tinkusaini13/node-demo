name: Clone Repo 

on:
  push:
    branches:
      - node  # Trigger on push to the main branch

jobs:
  clone-repo:
    runs-on: ubuntu-latest  

    steps:
   
    - name: Checkout repository
      uses: actions/checkout@v3

   
    - name: SSH into EC2 and clone the repository
      run: |
        
        sudo apt-get install sshpass
        sshpass -p "${{ secrets.EC2_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
          cd /home/${{ secrets.EC2_USER }}
          git clone https://github.com/tinkusaini13/node-demo.git 
        EOF
